name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # push version commits and release tags
      pull-requests: write # open the "Version Packages" pull request
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # Trusted publishing needs npm 11.5.1+, newer than the npm bundled with
      # Node.js 22. pnpm hands the actual upload to this npm.
      - run: npm install -g npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # With pending changesets, opens or updates the "Version Packages" pull
      # request. Once that is merged, publishes every version not yet on npm.
      - uses: changesets/action@v1
        id: changesets
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: "chore: version packages"
          commit: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # JSR publishing uses OIDC too: each package is linked to this repo on
      # jsr.io. A version already on JSR is skipped. x12-core goes first
      # because x12-834 depends on it.
      - name: Publish x12-core to JSR
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/x12-core
        run: npx --yes jsr publish
      - name: Publish x12-834 to JSR
        if: steps.changesets.outputs.hasChangesets == 'false'
        working-directory: packages/x12-834
        run: npx --yes jsr publish
